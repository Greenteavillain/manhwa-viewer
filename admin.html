<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a; --surface: #141414; --surface2: #1c1c1c;
      --border: #222; --border2: #2a2a2a;
      --accent: #7c6af7; --accent-dim: #2e2060;
      --text: #e0e0e0; --dim: #888; --faint: #444;
      --danger: #ef4444; --danger-dim: #2a0a0a;
    }

    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px;
    }

    /* ── LOGIN ── */
    #login {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 44px 40px; width: 320px; text-align: center;
    }
    .login-box h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .login-box p  { font-size: 0.88rem; color: var(--dim); margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 10px 12px;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 7px; color: var(--text); font-size: 0.9rem;
      outline: none; margin-bottom: 12px;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%; padding: 10px;
      background: var(--accent-dim); border: 1px solid var(--accent);
      border-radius: 7px; color: #c4b5fd; cursor: pointer; font-size: 0.88rem;
      transition: background 0.15s;
    }
    .login-box button:hover { background: #3d2d80; }
    .login-err { color: #f87171; font-size: 0.76rem; margin-top: 10px; display: none; }

    /* ── APP ── */
    #app { display: none; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: 52px; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1rem; color: var(--dim); font-weight: 400; }
    header h1 b { color: var(--text); font-weight: 700; }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    #last-updated { font-size: 0.8rem; color: var(--faint); }
    .hbtn {
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--dim); border-radius: 5px; padding: 4px 12px;
      cursor: pointer; font-size: 0.82rem; transition: color 0.12s;
    }
    .hbtn:hover { color: var(--text); }

    /* ── MAIN ── */
    main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

    .sec-title {
      font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--dim); margin-bottom: 14px;
    }
    .section { margin-bottom: 32px; }

    /* ── STAT CARDS ── */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px 20px;
    }
    .stat-card.hi { border-color: #3d2d80; }
    .stat-label { font-size: 0.8rem; color: var(--dim); margin-bottom: 10px; }
    .stat-value { font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .stat-card.hi .stat-value { color: #c4b5fd; }
    .stat-sub { font-size: 0.78rem; color: var(--faint); margin-top: 6px; }

    /* ── CHARTS ── */
    .chart-row { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px 20px 16px;
    }
    .chart-card h3 { font-size: 0.88rem; color: var(--dim); margin-bottom: 18px; }
    .chart-area { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar-body {
      width: 100%; background: var(--accent-dim); border-radius: 3px 3px 0 0;
      min-height: 2px; position: relative; cursor: default;
      transition: background 0.15s;
    }
    .bar-body:hover { background: var(--accent); }
    .bar-tip {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--dim); padding-bottom: 3px; white-space: nowrap;
    }
    .bar-label { font-size: 11px; color: var(--faint); margin-top: 5px; text-align: center; white-space: nowrap; }
    .chart-empty { width: 100%; text-align: center; font-size: 0.88rem; color: var(--faint); padding: 30px 0; }

    /* ── PDF GRID ── */
    .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .pdf-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px;
    }
    .pdf-card-name { font-size: 0.95rem; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-card-meta { font-size: 0.82rem; color: var(--dim); display: flex; gap: 12px; }
    .pdf-card-meta span b { color: var(--text); }

    /* ── TABLE ── */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .filter-row input, .filter-row select {
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); border-radius: 6px; padding: 7px 12px;
      font-size: 0.88rem; outline: none; min-width: 140px;
    }
    .filter-row input { flex: 1; }
    .filter-row input:focus, .filter-row select:focus { border-color: var(--accent); }

    .tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th {
      background: var(--surface2); color: var(--dim); padding: 12px 14px;
      text-align: left; border-bottom: 1px solid var(--border);
      font-size: 0.78rem; letter-spacing: 0.5px; font-weight: 600; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #111; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 10px 14px; vertical-align: top; }
    .td-dim { color: var(--dim); white-space: nowrap; }
    .td-content { max-width: 260px; color: #bbb; white-space: pre-wrap; word-break: break-all; }
    .tag {
      display: inline-block; padding: 3px 8px; border-radius: 4px;
      font-size: 0.75rem; background: var(--surface2);
      color: var(--dim); border: 1px solid var(--border2); white-space: nowrap;
    }
    .btn-del {
      background: none; border: 1px solid var(--border2); color: var(--faint);
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 0.8rem;
      white-space: nowrap; transition: all 0.12s;
    }
    .btn-del:hover { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
    .tbl-empty { text-align: center; padding: 44px; color: var(--faint); font-size: 0.82rem; }

    /* ── MISC ── */
    .row-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .badge { font-size: 0.82rem; color: var(--dim); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .stat-grid  { grid-template-columns: repeat(2, 1fr); }
      .chart-row  { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stat-grid  { grid-template-columns: 1fr 1fr; }
      main { padding: 16px 12px 40px; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login">
  <div class="login-box">
    <h2>관리자 대시보드</h2>
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off">
    <button id="pw-btn">로그인</button>
    <div class="login-err" id="login-err">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <header>
    <h1>manhwa viewer &nbsp;<b>관리자</b></h1>
    <div class="hdr-right">
      <span id="last-updated"></span>
      <button class="hbtn" id="btn-refresh">새로고침</button>
      <button class="hbtn" id="btn-logout">로그아웃</button>
    </div>
  </header>

  <main>
    <div id="loading"><div class="spinner"></div></div>
    <div id="content" style="display:none">

      <!-- 개요 -->
      <div class="section">
        <p class="sec-title">개요</p>
        <div class="stat-grid">
          <div class="stat-card hi">
            <div class="stat-label">총 방문 수</div>
            <div class="stat-value" id="s-total">—</div>
            <div class="stat-sub" id="s-today"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">이번 주 방문</div>
            <div class="stat-value" id="s-week">—</div>
            <div class="stat-sub">최근 7일</div>
          </div>
          <div class="stat-card hi">
            <div class="stat-label">총 메모 수</div>
            <div class="stat-value" id="s-annots">—</div>
            <div class="stat-sub" id="s-authors"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">작품 수</div>
            <div class="stat-value" id="s-pdfs">—</div>
            <div class="stat-sub">등록된 PDF</div>
          </div>
        </div>
      </div>

      <!-- 방문 통계 -->
      <div class="section">
        <p class="sec-title">방문 통계</p>
        <div class="chart-row">
          <div class="chart-card">
            <h3>최근 14일 방문</h3>
            <div id="chart-daily"></div>
          </div>
          <div class="chart-card">
            <h3>요일별 방문</h3>
            <div id="chart-dow"></div>
          </div>
        </div>
      </div>

      <!-- PDF별 현황 -->
      <div class="section">
        <p class="sec-title">PDF별 현황</p>
        <div class="pdf-grid" id="pdf-grid"></div>
      </div>

      <!-- 메모 관리 -->
      <div class="section">
        <div class="row-between" style="margin-bottom:14px">
          <p class="sec-title" style="margin:0">메모 관리</p>
          <span class="badge" id="annot-count"></span>
        </div>
        <div class="filter-row">
          <input type="text" id="f-author"  placeholder="작성자 검색…">
          <input type="text" id="f-content" placeholder="내용 검색…">
          <select id="f-pdf"><option value="">전체 PDF</option></select>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>PDF</th>
                <th>페이지</th>
                <th>작성자</th>
                <th>내용</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="tbl-empty" class="tbl-empty" style="display:none">메모가 없습니다.</div>
        </div>
      </div>

    </div><!-- /content -->
  </main>
</div>

<script>
(function () {
  'use strict';

  /* ── 설정 (비밀번호 여기서 변경) ── */
  const ADMIN_PW = 'admin1234';
  const SB_URL   = 'https://ihecmsgxpfdiizlkdylv.supabase.co';
  const SB_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZWNtc2d4cGZkaWl6bGtkeWx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NDQxNTUsImV4cCI6MjA5MzAyMDE1NX0.yKOehtOFcr7IRpDFsKmiRJFB63QsAxk1NU258EKfr0s';

  /* ── 로그인 ── */
  if (sessionStorage.getItem('adm') === '1') boot();

  document.getElementById('pw-btn').addEventListener('click', tryLogin);
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  function tryLogin() {
    if (document.getElementById('pw').value === ADMIN_PW) {
      sessionStorage.setItem('adm', '1');
      boot();
    } else {
      document.getElementById('login-err').style.display = 'block';
      document.getElementById('pw').value = '';
    }
  }

  function boot() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display   = 'block';
    loadAll();
  }

  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.removeItem('adm'); location.reload();
  });
  document.getElementById('btn-refresh').addEventListener('click', loadAll);

  /* ── Supabase ── */
  async function sbGet(path) {
    const res = await fetch(SB_URL + '/rest/v1/' + path, {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  async function sbDel(path) {
    await fetch(SB_URL + '/rest/v1/' + path, {
      method: 'DELETE',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
  }

  /* ── 유틸 ── */
  const esc    = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pdfNm  = p => decodeURIComponent((p || '(없음)').split('/').pop().replace(/\.pdf$/i, ''));
  const dtKey  = iso => new Date(iso).toISOString().slice(0, 10);
  const fmtDt  = iso => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  };

  /* ── 데이터 ── */
  let visits = [], annots = [];

  async function loadAll() {
    document.getElementById('loading').style.display  = 'block';
    document.getElementById('content').style.display  = 'none';

    [visits, annots] = await Promise.all([
      sbGet('visits?select=pdf_file,visited_at&order=visited_at.desc&limit=5000'),
      sbGet('annotations?select=*&order=created_at.desc')
    ]);

    renderStats();
    renderCharts();
    renderPdfs();
    renderTable();

    document.getElementById('last-updated').textContent =
      new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 기준';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  /* ── 개요 ── */
  function renderStats() {
    const today   = new Date().toISOString().slice(0, 10);
    const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
    const todayCnt = visits.filter(v => dtKey(v.visited_at) === today).length;
    const weekCnt  = visits.filter(v => v.visited_at >= weekAgo).length;
    const authors  = new Set(annots.map(a => a.author).filter(Boolean)).size;
    const pdfs     = new Set([...visits.map(v => v.pdf_file), ...annots.map(a => a.pdf_file)].filter(Boolean)).size;

    document.getElementById('s-total').textContent   = visits.length.toLocaleString();
    document.getElementById('s-today').textContent   = `오늘 ${todayCnt}명 방문`;
    document.getElementById('s-week').textContent    = weekCnt.toLocaleString();
    document.getElementById('s-annots').textContent  = annots.length.toLocaleString();
    document.getElementById('s-authors').textContent = `작성자 ${authors}명`;
    document.getElementById('s-pdfs').textContent    = pdfs.toLocaleString();
  }

  /* ── 차트 ── */
  function makeChart(containerId, data, labels) {
    const el  = document.getElementById(containerId);
    el.innerHTML = '';

    const max = Math.max(...data, 1);
    if (data.every(v => v === 0)) {
      el.innerHTML = '<div class="chart-empty">방문 데이터가 없습니다.</div>';
      return;
    }

    const area = document.createElement('div');
    area.className = 'chart-area';

    const lblRow = document.createElement('div');
    lblRow.style.cssText = 'display:flex;gap:3px;margin-top:6px;';

    data.forEach((val, i) => {
      const col = document.createElement('div');
      col.className = 'bar-col';

      const pct  = Math.max((val / max) * 100, val > 0 ? 3 : 0);
      const body = document.createElement('div');
      body.className = 'bar-body';
      body.style.height = pct + '%';
      body.title = `${labels[i]}: ${val}`;

      if (val > 0) {
        const tip = document.createElement('div');
        tip.className = 'bar-tip';
        tip.textContent = val;
        body.appendChild(tip);
      }

      col.appendChild(body);
      area.appendChild(col);

      const lbl = document.createElement('div');
      lbl.style.cssText = 'flex:1;font-size:11px;color:var(--faint);text-align:center;';
      lbl.textContent = labels[i];
      lblRow.appendChild(lbl);
    });

    el.appendChild(area);
    el.appendChild(lblRow);
  }

  function renderCharts() {
    // 최근 14일
    const dailyData = [], dailyLabels = [];
    for (let i = 13; i >= 0; i--) {
      const d   = new Date(Date.now() - i * 86400000);
      const key = d.toISOString().slice(0, 10);
      dailyLabels.push(`${d.getMonth() + 1}/${d.getDate()}`);
      dailyData.push(visits.filter(v => dtKey(v.visited_at) === key).length);
    }
    makeChart('chart-daily', dailyData, dailyLabels);

    // 요일별
    const DOW   = ['일','월','화','수','목','금','토'];
    const dowData = [0,0,0,0,0,0,0];
    visits.forEach(v => dowData[new Date(v.visited_at).getDay()]++);
    makeChart('chart-dow', dowData, DOW);
  }

  /* ── PDF 현황 ── */
  function renderPdfs() {
    const grid     = document.getElementById('pdf-grid');
    const vMap     = {}, aMap = {};
    visits.forEach(v => { if (v.pdf_file) vMap[v.pdf_file] = (vMap[v.pdf_file] || 0) + 1; });
    annots.forEach(a => { if (a.pdf_file) aMap[a.pdf_file] = (aMap[a.pdf_file] || 0) + 1; });
    const all = [...new Set([...Object.keys(vMap), ...Object.keys(aMap)])];

    if (!all.length) { grid.innerHTML = '<p style="color:var(--faint);font-size:0.8rem">데이터 없음</p>'; return; }

    grid.innerHTML = all
      .sort((a, b) => (vMap[b] || 0) - (vMap[a] || 0))
      .map(p => `
        <div class="pdf-card">
          <div class="pdf-card-name" title="${esc(p)}">${esc(pdfNm(p))}</div>
          <div class="pdf-card-meta">
            <span>방문 <b>${vMap[p] || 0}</b>회</span>
            <span>메모 <b>${aMap[p] || 0}</b>개</span>
          </div>
        </div>`
      ).join('');
  }

  /* ── 메모 테이블 ── */
  function renderTable() {
    const pdfSel = document.getElementById('f-pdf');
    const prev   = pdfSel.value;
    const pdfs   = [...new Set(annots.map(a => a.pdf_file).filter(Boolean))];
    pdfSel.innerHTML = '<option value="">전체 PDF</option>' +
      pdfs.map(p => `<option value="${esc(p)}">${esc(pdfNm(p))}</option>`).join('');
    if (pdfs.includes(prev)) pdfSel.value = prev;
    applyFilter();
  }

  function applyFilter() {
    const fa = document.getElementById('f-author').value.trim().toLowerCase();
    const fc = document.getElementById('f-content').value.trim().toLowerCase();
    const fp = document.getElementById('f-pdf').value;

    const rows = annots.filter(a =>
      (!fp || a.pdf_file === fp) &&
      (!fa || (a.author  || '').toLowerCase().includes(fa)) &&
      (!fc || (a.content || '').toLowerCase().includes(fc))
    );

    document.getElementById('annot-count').textContent = `${rows.length} / ${annots.length}개`;

    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('tbl-empty');

    if (!rows.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    tbody.innerHTML = rows.map(a => `
      <tr>
        <td class="td-dim">${fmtDt(a.created_at)}</td>
        <td><span class="tag">${esc(pdfNm(a.pdf_file))}</span></td>
        <td class="td-dim">${a.page_number}p</td>
        <td>${esc(a.author || '익명')}</td>
        <td class="td-content">${esc(a.content)}</td>
        <td><button class="btn-del" data-id="${esc(a.id)}">삭제</button></td>
      </tr>`
    ).join('');

    tbody.querySelectorAll('.btn-del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 메모를 삭제하시겠습니까?')) return;
        btn.disabled = true; btn.textContent = '…';
        await sbDel(`annotations?id=eq.${btn.dataset.id}`);
        annots = annots.filter(a => a.id !== btn.dataset.id);
        renderStats();
        renderPdfs();
        renderTable();
      });
    });
  }

  ['f-author','f-content'].forEach(id =>
    document.getElementById(id).addEventListener('input', applyFilter)
  );
  document.getElementById('f-pdf').addEventListener('change', applyFilter);

})();
</script>
</body>
</html>
