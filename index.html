<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만화 라이브러리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(180deg, #1a1a2e 0%, #0d0d0d 100%);
      padding: 2rem 2rem 1.5rem;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    header h1 span {
      color: #7c6af7;
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid #2a2a2a;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px #7c6af7;
    }

    .cover-wrap {
      position: relative;
      width: 100%;
      padding-top: 140%;
      background: #111;
      overflow: hidden;
    }

    .cover-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      color: #a5b4fc;
      text-align: center;
      padding: 1rem;
    }

    .cover-placeholder .icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      opacity: 0.6;
    }

    .cover-placeholder .title-preview {
      font-size: 0.8rem;
      font-weight: 600;
      color: #c7d2fe;
      line-height: 1.3;
    }

    .loading-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card-info {
      padding: 0.75rem;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .card-meta {
      font-size: 0.72rem;
      color: #666;
      display: flex;
      gap: 0.5rem;
    }

    .badge {
      background: #2a2a3e;
      color: #a5b4fc;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
    }

    .error-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #555;
    }

    .error-state p {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
      header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 만화 <span>라이브러리</span></h1>
    <p class="subtitle">클릭하여 읽기 시작</p>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function renderCover(pdfUrl, container) {
      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1 });
        const scale = container.clientWidth / viewport.width;
        const scaled = page.getViewport({ scale: scale || 1 });

        const canvas = document.createElement('canvas');
        canvas.className = 'cover-canvas';
        canvas.width = scaled.width;
        canvas.height = scaled.height;

        await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;

        container.innerHTML = '';
        container.appendChild(canvas);
      } catch {
        container.innerHTML = container.dataset.fallback;
      }
    }

    async function init() {
      const grid = document.getElementById('grid');

      let items;
      try {
        const res = await fetch('manifest.json');
        items = await res.json();
      } catch {
        grid.innerHTML = `<div class="error-state">
          <div style="font-size:3rem">📂</div>
          <p>manifest.json을 불러올 수 없습니다.</p>
          <p>GitHub Pages에서 실행해주세요.</p>
        </div>`;
        return;
      }

      for (const item of items) {
        const fallback = `<div class="cover-placeholder">
          <div class="icon">📖</div>
          <div class="title-preview">${item.title}</div>
        </div>`;

        const card = document.createElement('a');
        card.className = 'card';
        card.href = `viewer.html?pdf=${encodeURIComponent(item.file)}&title=${encodeURIComponent(item.title)}`;
        card.innerHTML = `
          <div class="cover-wrap" id="cover-${item.id}">
            <div class="loading-spinner"><div class="spinner"></div></div>
          </div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              ${item.genre ? `<span class="badge">${item.genre}</span>` : ''}
              ${item.pages ? `<span>${item.pages}p</span>` : ''}
            </div>
          </div>`;
        grid.appendChild(card);

        const coverWrap = card.querySelector(`#cover-${item.id}`);
        coverWrap.dataset.fallback = fallback;

        // Lazy load covers with IntersectionObserver
        const observer = new IntersectionObserver((entries, obs) => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              obs.unobserve(entry.target);
              renderCover(item.file, entry.target);
            }
          }
        }, { rootMargin: '200px' });
        observer.observe(coverWrap);
      }
    }

    init();
  </script>
</body>
</html>
