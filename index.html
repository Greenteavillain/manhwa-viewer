<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>만화 라이브러리</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      color: #1d1d1f;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      padding: 3.75rem 2rem 0;
      max-width: 1400px;
      margin: 0 auto;
      cursor: pointer;
      transition: padding 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }
    header.expanded {
      padding: 300px 2rem 0;
    }

    header .logo {
      display: block;
      width: fit-content;
      margin: 0 auto 2rem;
      color: #73ad6b;
      line-height: 0;
      transition: margin 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }
    header.expanded .logo {
      margin-bottom: 300px;
    }
    header .logo svg {
      display: block;
      height: 90px;
      width: auto;
      user-select: none;
    }
    header .logo svg #eye-left.returning,
    header .logo svg #eye-right.returning {
      transition: cx 0.9s cubic-bezier(.4,.0,.2,1), cy 0.9s cubic-bezier(.4,.0,.2,1);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .filter-btn {
      background: none;
      border: none;
      padding: 0.45rem 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: #8e8e93;
      letter-spacing: -0.1px;
      position: relative;
      transition: color 0.15s;
    }

    .filter-btn:hover { color: #3a3a3c; }

    .filter-btn.active {
      color: #1d1d1f;
      font-weight: 700;
    }

    .filter-btn.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: #73ad6b;
      border-radius: 1px;
    }

    .filter-btn .count {
      margin-left: 0.3rem;
      font-size: 0.78rem;
      font-weight: 400;
      opacity: 0.6;
    }

    main {
      padding: 0 0 2rem;
    }

    .genre-section {
      padding-bottom: 1.25rem;
    }

    .genre-sticky {
      border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    .floating-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      display: none;
      will-change: transform;
    }
    .floating-bar.visible { display: block; }

    .genre-sticky-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.65rem 2rem 0.55rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .genre-sticky-inner h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #8e8e93;
      letter-spacing: -0.2px;
    }

    .view-all {
      font-size: 0.72rem;
      color: #8e8e93;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .view-all:hover { color: #6e6e73; text-decoration: underline; }

    .genre-grid-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      cursor: pointer;
      transition: transform 0.18s ease;
      text-decoration: none;
      color: inherit;
      display: block;
      padding: 0.5rem 0.25rem 0;
    }

    .card:hover { transform: translateY(-3px); }

    .cover-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: transparent;
      overflow: hidden;
      border-radius: 4px;
    }

    .cover-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .cover-icon img {
      width: 70%;
      height: auto;
      -webkit-user-drag: none;
      user-select: none;
    }
    /* 지정 SVG 아이콘은 기본의 90% 크기(70%→63%)로 살짝 작게 */
    .cover-icon.custom img { width: 63%; }
    .card:hover .cover-icon {
      opacity: 0;
      transform: scale(0.94);
    }

    .cover-thumb {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card:hover .cover-thumb { opacity: 1; }

    .cover-thumb canvas {
      max-width: 88%;
      max-height: 88%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.38));
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .card-info {
      padding: 0.55rem 0.25rem 0;
      background: transparent;
      text-align: center;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 400;
      color: #1d1d1f;
      line-height: 1.25;
      word-break: keep-all;
      margin-bottom: 0.3rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.68rem;
      font-weight: 300;
      color: #73ad6b;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.35rem;
      line-height: 1.1;
    }

    .card-meta .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: #73ad6b;
      opacity: 0.55;
    }

    .error-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #555;
    }

    .error-state p {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .genre-sticky-inner { padding: 0.5rem 1rem 0.45rem; }
      .genre-grid-inner   { padding: 0.85rem 1rem 0; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
      header { padding: 2.5rem 1rem 0; }
      header .logo { margin-bottom: 1.5rem; }
      header .logo svg { height: 69px; }
      .filters { gap: 1.1rem; }
      .filter-btn { font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="logo" aria-label="만화 라이브러리">
      <svg viewBox="0 0 137.17 63.75" xmlns="http://www.w3.org/2000/svg"
           fill="none" stroke="currentColor" stroke-width="3" stroke-miterlimit="10"
           aria-hidden="true">
        <circle cx="31.87"  cy="31.87" r="30.37"/>
        <circle cx="105.3"  cy="31.87" r="30.37"/>
        <line   x1="62.25"  y1="31.87" x2="74.93" y2="31.87"/>
        <circle id="eye-left"  cx="50.28"  cy="31.87" r="4.85"/>
        <circle id="eye-right" cx="123.68" cy="31.87" r="4.85"/>
        <path   id="lid-left"  style="display:none"
                stroke-linejoin="round" stroke-linecap="round"
                d="M 19.87 12.87 L 51.87 31.87 L 19.87 50.87"/>
        <path   id="lid-right" style="display:none"
                stroke-linejoin="round" stroke-linecap="round"
                d="M 117.3 12.87 L 85.3 31.87 L 117.3 50.87"/>
      </svg>
    </h1>
    <nav class="filters" id="filters"></nav>
  </header>
  <div class="floating-bar" id="floatingBar"></div>
  <main>
    <div id="sections"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const randomPdfIcon = () =>
      `<img src="pdf${Math.floor(Math.random() * 5) + 1}.png" alt="PDF" draggable="false">`;

    async function renderCover(pdfUrl, coverWrap) {
      const thumb = coverWrap.querySelector('.cover-thumb');
      if (!thumb) return;
      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        const card = coverWrap.closest('.card');
        const pageCountEl = card && card.querySelector('.page-count');
        if (pageCountEl) pageCountEl.textContent = `${pdf.numPages.toLocaleString()} 페이지`;

        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1 });
        const scale = coverWrap.clientWidth / viewport.width;
        const scaled = page.getViewport({ scale: scale || 1 });

        const canvas = document.createElement('canvas');
        canvas.width = scaled.width;
        canvas.height = scaled.height;

        await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;
        thumb.innerHTML = '';
        thumb.appendChild(canvas);
      } catch {
        /* keep PDF icon visible on failure */
      }
    }

    async function init() {
      const sectionsEl = document.getElementById('sections');
      const filtersEl  = document.getElementById('filters');

      let items;
      try {
        const res = await fetch('manifest.json');
        items = await res.json();
      } catch {
        sectionsEl.innerHTML = `<div class="error-state">
          <div style="font-size:3rem">📂</div>
          <p>manifest.json을 불러올 수 없습니다.</p>
          <p>GitHub Pages에서 실행해주세요.</p>
        </div>`;
        return;
      }

      // Group by genre, preserving manifest order within each group
      const groups = {};
      for (const it of items) {
        const g = it.genre || '기타';
        (groups[g] = groups[g] || []).push(it);
      }
      const genres = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ko'));

      let activeGenre = 'all';

      const renderFilters = () => {
        filtersEl.innerHTML = '';
        const all = document.createElement('button');
        all.className = 'filter-btn' + (activeGenre === 'all' ? ' active' : '');
        all.innerHTML = `전체<span class="count">${items.length}</span>`;
        all.onclick = () => { activeGenre = 'all'; renderFilters(); applyFilter(); };
        filtersEl.appendChild(all);

        for (const g of genres) {
          const btn = document.createElement('button');
          btn.className = 'filter-btn' + (activeGenre === g ? ' active' : '');
          btn.innerHTML = `${g}<span class="count">${groups[g].length}</span>`;
          btn.onclick = () => { activeGenre = g; renderFilters(); applyFilter(); };
          filtersEl.appendChild(btn);
        }
      };

      let applyFilter = () => {
        for (const sec of sectionsEl.querySelectorAll('.genre-section')) {
          const g = sec.dataset.genre;
          sec.style.display = (activeGenre === 'all' || g === activeGenre) ? '' : 'none';
        }
      };

      renderFilters();

      const observer = new IntersectionObserver((entries, obs) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            obs.unobserve(entry.target);
            renderCover(entry.target.dataset.pdf, entry.target);
          }
        }
      }, { rootMargin: '200px' });

      for (const g of genres) {
        const section = document.createElement('section');
        section.className = 'genre-section';
        section.dataset.genre = g;
        section.innerHTML = `
          <div class="genre-sticky">
            <div class="genre-sticky-inner">
              <h2>${g}</h2>
              <a class="view-all" href="viewer.html?genre=${encodeURIComponent(g)}">전체 보기 (${groups[g].length}개)</a>
            </div>
          </div>
          <div class="genre-grid-inner">
            <div class="grid"></div>
          </div>
        `;
        const grid = section.querySelector('.grid');

        for (const item of groups[g]) {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.id
            ? `viewer.html?id=${encodeURIComponent(item.id)}`
            : `viewer.html?pdf=${encodeURIComponent(item.file)}&title=${encodeURIComponent(item.title)}`;

          const fileName = (item.file.split('/').pop()) || `${item.title}.pdf`;

          card.innerHTML = `
            <div class="cover-wrap" data-pdf="${item.file}">
              <div class="cover-icon${item.icon ? ' custom' : ''}">${item.icon ? `<img src="${item.icon}" alt="PDF" draggable="false">` : randomPdfIcon()}</div>
              <div class="cover-thumb"></div>
            </div>
            <div class="card-info">
              <div class="card-title">${fileName}</div>
              <div class="card-meta"><span class="page-count"></span></div>
            </div>`;
          grid.appendChild(card);

          observer.observe(card.querySelector('.cover-wrap'));
        }

        sectionsEl.appendChild(section);
      }

      // Floating bar: separate fixed-position bar that mirrors the currently-active
      // section header. Original .genre-sticky elements stay in normal flow.
      const floatingBar = document.getElementById('floatingBar');
      let currentGenre = null;

      const updateFloatingBar = () => {
        const sections = Array.from(sectionsEl.querySelectorAll('.genre-section'))
          .filter(s => s.offsetParent !== null);

        // Reset any per-frame inline overrides on natural headers.
        sectionsEl.querySelectorAll('.genre-sticky').forEach(h => {
          h.style.borderTopColor = '';
        });

        const barHeight = floatingBar.offsetHeight || 0;
        let active = null;
        let nextHeader = null;

        for (let i = 0; i < sections.length; i++) {
          const header = sections[i].querySelector('.genre-sticky');
          const top = header.getBoundingClientRect().top;
          if (top <= 0) {
            active = { section: sections[i], header };
          } else {
            if (active) nextHeader = header;
            break;
          }
        }

        if (!active) {
          floatingBar.classList.remove('visible');
          floatingBar.style.transform = '';
          currentGenre = null;
          return;
        }

        const genre = active.section.dataset.genre;
        if (genre !== currentGenre) {
          floatingBar.innerHTML = active.header.innerHTML;
          currentGenre = genre;
        }
        floatingBar.classList.add('visible');

        // Push-up: when the next section's natural header enters the floating
        // bar's space, slide the bar up so the new header takes its place.
        // During overlap, hide the incoming header's border-top so it doesn't
        // stack against the floating bar's border-bottom into a double line.
        if (nextHeader && barHeight > 0) {
          const nextTop = nextHeader.getBoundingClientRect().top;
          if (nextTop < barHeight) {
            floatingBar.style.transform = `translateY(${nextTop - barHeight}px)`;
            nextHeader.style.borderTopColor = 'transparent';
          } else {
            floatingBar.style.transform = '';
          }
        } else {
          floatingBar.style.transform = '';
        }
      };

      window.addEventListener('scroll', updateFloatingBar, { passive: true });
      window.addEventListener('resize', updateFloatingBar, { passive: true });

      // Re-run after filter changes (sections may hide/show).
      const origApplyFilter = applyFilter;
      applyFilter = () => { origApplyFilter(); updateFloatingBar(); };

      updateFloatingBar();
    }

    init();

    // 헤더 클릭 → 위아래 여백을 200px로 토글 (S자 곡선 슈웅)
    (function headerToggle() {
      const headerEl = document.querySelector('header');
      headerEl.addEventListener('click', e => {
        if (e.target.closest('.filter-btn')) return;
        headerEl.classList.toggle('expanded');
      });
    })();

    // 안경 눈동자가 마우스 커서를 따라보게.
    // 커서가 창 밖으로 나가면: 직전 각속도로 잠시 관성 회전 → 2초 후 디폴트(우측)로 스르륵 복귀.
    (function eyeTracker() {
      const leftEye  = document.getElementById('eye-left');
      const rightEye = document.getElementById('eye-right');
      const leftLid  = document.getElementById('lid-left');
      const rightLid = document.getElementById('lid-right');
      if (!leftEye || !rightEye) return;
      const svg = leftEye.ownerSVGElement;

      const VB_W = 137.17, VB_H = 63.75;
      const LENS_RADIUS = 30.37;          // visible lens radius in viewBox units
      const LENS = [
        { eye: leftEye,  lid: leftLid,  cx: 31.87,  cy: 31.87, orbit: 18.41, defaultCx: 50.28,  defaultCy: 31.87 },
        { eye: rightEye, lid: rightLid, cx: 105.30, cy: 31.87, orbit: 18.38, defaultCx: 123.68, defaultCy: 31.87 }
      ];
      const angles = [0, 0];                                 // angle from each lens center (rad)
      const radii  = [LENS[0].orbit, LENS[1].orbit];          // current distance from lens center
      const angVel = [0, 0];                                 // smoothed angular velocity (rad / ms)

      let pending = false, lastX = 0, lastY = 0, lastUpdate = 0;
      let inertiaRaf = null, returnTimer = null;
      let idleWaitTimer = null, idleInterval = null, idleAnimRaf = null;
      let idleAngle = 0;                 // last idle target (0=right, PI=left)
      let catchUpRaf = null;             // smooth re-entry from outside
      let cursorOutside = false;         // mouseleave sets this; first mousemove consumes it

      const IDLE_WAIT_MS     = 10000;    // 10s of no mousemove before idle starts
      const IDLE_LOOK_MS     = 1500;     // each look-shift takes 1.5s
      const CATCH_UP_MS      = 450;      // duration of the smooth-enter

      function setEye(lens, angle, radius) {
        lens.eye.setAttribute('cx', lens.cx + Math.cos(angle) * radius);
        lens.eye.setAttribute('cy', lens.cy + Math.sin(angle) * radius);
      }
      function setEyeClosed(lens, closed) {
        if (closed) {
          lens.eye.style.display = 'none';
          lens.lid.style.display = 'block';
        } else {
          lens.eye.style.display = '';
          lens.lid.style.display = 'none';
        }
      }
      // For each lens, close the eye if the cursor (in SVG coords) is inside.
      function updateLids(sx, sy) {
        for (let i = 0; i < LENS.length; i++) {
          const lens = LENS[i];
          const d = Math.hypot(sx - lens.cx, sy - lens.cy);
          setEyeClosed(lens, d < LENS_RADIUS - 1.5);
        }
      }
      function setLidsOpen() { for (const lens of LENS) setEyeClosed(lens, false); }
      function cancelLeaveBehavior() {
        if (inertiaRaf)  { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
        if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
        leftEye.classList.remove('returning');
        rightEye.classList.remove('returning');
      }

      // Smooth interpolation toward (targetAngle, orbit) over durationMs.
      function smoothLook(targetAngle, durationMs) {
        if (idleAnimRaf) { cancelAnimationFrame(idleAnimRaf); idleAnimRaf = null; }
        leftEye.classList.remove('returning');
        rightEye.classList.remove('returning');
        const startAngles = [angles[0], angles[1]];
        const deltaAngles = [];
        for (let i = 0; i < LENS.length; i++) {
          let delta = targetAngle - startAngles[i];
          while (delta >  Math.PI) delta -= 2 * Math.PI;
          while (delta < -Math.PI) delta += 2 * Math.PI;
          deltaAngles.push(delta);
        }
        const startRadii  = [radii[0], radii[1]];
        const targetRadii = [LENS[0].orbit, LENS[1].orbit];
        const startTime = performance.now();
        function tick(now) {
          const t = Math.min((now - startTime) / durationMs, 1);
          const e = 1 - Math.pow(1 - t, 3); // ease-out cubic
          for (let i = 0; i < LENS.length; i++) {
            angles[i] = startAngles[i] + deltaAngles[i] * e;
            radii[i]  = startRadii[i]  + (targetRadii[i] - startRadii[i]) * e;
            setEye(LENS[i], angles[i], radii[i]);
          }
          idleAnimRaf = t < 1 ? requestAnimationFrame(tick) : null;
        }
        idleAnimRaf = requestAnimationFrame(tick);
      }
      function doIdleLook() {
        idleAngle = (idleAngle === 0) ? Math.PI : 0;
        smoothLook(idleAngle, IDLE_LOOK_MS);
      }
      function cancelIdle() {
        if (idleWaitTimer) { clearTimeout(idleWaitTimer); idleWaitTimer = null; }
        if (idleInterval)  { clearInterval(idleInterval);  idleInterval  = null; }
        if (idleAnimRaf)   { cancelAnimationFrame(idleAnimRaf); idleAnimRaf = null; }
      }
      function scheduleIdle() {
        cancelIdle();
        idleAngle = 0;                    // start cycle by looking left
        idleWaitTimer = setTimeout(() => {
          setLidsOpen();
          doIdleLook();
          idleInterval = setInterval(doIdleLook, IDLE_WAIT_MS);
        }, IDLE_WAIT_MS);
      }

      // Smoothly bring eyes from current state to the live cursor target.
      // Target updates each frame from lastX/lastY so the eyes track even
      // while the catch-up is in progress.
      function smoothCatchUp(durationMs) {
        if (catchUpRaf)  { cancelAnimationFrame(catchUpRaf);  catchUpRaf  = null; }
        if (idleAnimRaf) { cancelAnimationFrame(idleAnimRaf); idleAnimRaf = null; }
        leftEye.classList.remove('returning');
        rightEye.classList.remove('returning');
        const startAngles = [angles[0], angles[1]];
        const startRadii  = [radii[0],  radii[1]];
        const startTime = performance.now();
        function tick(now) {
          const t = Math.min((now - startTime) / durationMs, 1);
          const e = 1 - Math.pow(1 - t, 3);
          const rect = svg.getBoundingClientRect();
          if (!rect.width) { catchUpRaf = requestAnimationFrame(tick); return; }
          const sx = ((lastX - rect.left) / rect.width)  * VB_W;
          const sy = ((lastY - rect.top)  / rect.height) * VB_H;
          updateLids(sx, sy);
          for (let i = 0; i < LENS.length; i++) {
            const lens = LENS[i];
            const dx = sx - lens.cx;
            const dy = sy - lens.cy;
            const d  = Math.hypot(dx, dy);
            const targetAngle  = d > 0.001 ? Math.atan2(dy, dx) : startAngles[i];
            const targetRadius = Math.min(d, lens.orbit);
            let delta = targetAngle - startAngles[i];
            while (delta >  Math.PI) delta -= 2 * Math.PI;
            while (delta < -Math.PI) delta += 2 * Math.PI;
            angles[i] = startAngles[i] + delta * e;
            radii[i]  = startRadii[i]  + (targetRadius - startRadii[i]) * e;
            setEye(lens, angles[i], radii[i]);
          }
          catchUpRaf = t < 1 ? requestAnimationFrame(tick) : null;
        }
        catchUpRaf = requestAnimationFrame(tick);
      }

      function update() {
        pending = false;
        // Catch-up rAF owns the eyes during smooth re-entry.
        if (catchUpRaf) return;
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;
        const sx = ((lastX - rect.left) / rect.width)  * VB_W;
        const sy = ((lastY - rect.top)  / rect.height) * VB_H;
        updateLids(sx, sy);
        const now = performance.now();
        const dt = lastUpdate > 0 ? now - lastUpdate : 16;

        for (let i = 0; i < LENS.length; i++) {
          const lens = LENS[i];
          const dx = sx - lens.cx;
          const dy = sy - lens.cy;
          const d  = Math.hypot(dx, dy);
          // Outer wall only: clamp distance to orbit. When cursor is inside,
          // the eye sits right on the cursor (no inner wall pushing it out).
          const angle  = d > 0.001 ? Math.atan2(dy, dx) : angles[i];
          const radius = Math.min(d, lens.orbit);
          if (dt > 0 && dt < 100) {
            let delta = angle - angles[i];
            while (delta >  Math.PI) delta -= 2 * Math.PI;
            while (delta < -Math.PI) delta += 2 * Math.PI;
            angVel[i] = angVel[i] * 0.5 + (delta / dt) * 0.5; // EWMA
          }
          angles[i] = angle;
          radii[i]  = radius;
          setEye(lens, angle, radius);
        }
        lastUpdate = now;
      }
      function schedule(x, y) {
        lastX = x; lastY = y;
        if (cursorOutside) {
          cursorOutside = false;
          cancelLeaveBehavior();
          cancelIdle();
          scheduleIdle();
          smoothCatchUp(CATCH_UP_MS);
          return;
        }
        cancelLeaveBehavior();
        cancelIdle();
        scheduleIdle();
        if (!pending) { pending = true; requestAnimationFrame(update); }
      }

      function startInertia() {
        if (catchUpRaf) { cancelAnimationFrame(catchUpRaf); catchUpRaf = null; }
        let lastFrame = performance.now();
        function tick(now) {
          const dt = now - lastFrame;
          lastFrame = now;
          let moving = false;
          for (let i = 0; i < LENS.length; i++) {
            angles[i] += angVel[i] * dt;
            angVel[i] *= Math.pow(0.85, dt / 16); // exponential damping
            setEye(LENS[i], angles[i], radii[i]);
            if (Math.abs(angVel[i]) > 0.0005) moving = true;
          }
          inertiaRaf = moving ? requestAnimationFrame(tick) : null;
        }
        inertiaRaf = requestAnimationFrame(tick);

        returnTimer = setTimeout(() => {
          if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
          leftEye.classList.add('returning');
          rightEye.classList.add('returning');
          for (const lens of LENS) {
            lens.eye.setAttribute('cx', lens.defaultCx);
            lens.eye.setAttribute('cy', lens.defaultCy);
          }
          angles[0] = angles[1] = 0; // default angle = 0 (pointing right)
          radii[0]  = LENS[0].orbit;
          radii[1]  = LENS[1].orbit;
          angVel[0] = angVel[1] = 0;
          returnTimer = null;
        }, 2000);
      }

      document.addEventListener('mousemove', e => schedule(e.clientX, e.clientY));
      document.addEventListener('touchmove', e => {
        if (e.touches[0]) schedule(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      document.documentElement.addEventListener('mouseleave', () => {
        cursorOutside = true;
        setLidsOpen();
        startInertia();
      });

      // Start the idle cycle right away — if no mouse touches the page for 10s,
      // the eyes begin alternating left/right every 10s.
      scheduleIdle();
    })();
  </script>
</body>
</html>
